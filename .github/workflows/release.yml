# Gera o AppImage. Push de uma tag `vX.Y.Z` (igual à versão do tauri.conf.json) cria um rascunho de release;
# rodar manualmente em Actions só compila e guarda o AppImage como artefato (nunca mexe em releases).
# Ubuntu 22.04 de propósito: o AppImage herda a glibc do build (2.35), e assim roda em distros mais antigas.
name: release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  appimage:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v7

      - name: Tag confere com a versão
        if: github.ref_type == 'tag'
        run: |
          version=$(jq -r .version src-tauri/tauri.conf.json)
          if [ "${GITHUB_REF_NAME}" != "v${version}" ]; then
            echo "::error::tag ${GITHUB_REF_NAME} diferente da versão v${version} do tauri.conf.json"
            exit 1
          fi

      - name: Dependências do sistema
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev \
            libpulse-dev patchelf xdg-utils

      - uses: actions/setup-node@v7
        with:
          node-version: lts/*
          cache: npm

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - run: npm ci

      - name: Build de teste (manual)
        if: github.ref_type != 'tag'
        run: npx tauri build

      - uses: actions/upload-artifact@v7
        if: github.ref_type != 'tag'
        with:
          name: appimage
          path: target/release/bundle/appimage/*.AppImage
          if-no-files-found: error
          retention-days: 7

      - uses: tauri-apps/tauri-action@v1
        if: github.ref_type == 'tag'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: v__VERSION__
          releaseName: Transcriptary v__VERSION__
          releaseBody: |
            Download the `.AppImage`, make it executable (`chmod +x`) and run it.
            See the README for the `tary` command and the first-run setup.
          releaseDraft: true
          prerelease: false
          uploadUpdaterJson: false
