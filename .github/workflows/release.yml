# Gera o AppImage e cria um rascunho de release no GitHub.
# Disparo: push de uma tag `vX.Y.Z` (igual à versão do tauri.conf.json) ou manual em Actions.
# Ubuntu 22.04 de propósito: o AppImage herda a glibc do build (2.35), e assim roda em distros mais antigas.
name: release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  appimage:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Tag confere com a versão
        if: github.ref_type == 'tag'
        run: |
          version=$(jq -r .version src-tauri/tauri.conf.json)
          if [ "${GITHUB_REF_NAME}" != "v${version}" ]; then
            echo "::error::tag ${GITHUB_REF_NAME} diferente da versão v${version} do tauri.conf.json"
            exit 1
          fi

      - name: Dependências do sistema
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev \
            libpulse-dev patchelf xdg-utils

      - uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: npm

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - run: npm ci

      - uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: v__VERSION__
          releaseName: Rustranscript v__VERSION__
          releaseBody: |
            Download the `.AppImage`, make it executable (`chmod +x`) and run it.
            See the README for the `rstt` command and the first-run setup.
          releaseDraft: true
          prerelease: false
          uploadUpdaterJson: false
