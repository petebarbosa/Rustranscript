[workspace]
resolver = "3"
members = ["crates/core", "crates/recorder", "src-tauri"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"

[workspace.dependencies]
anyhow = "1"
thiserror = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rusqlite = { version = "0.40", features = ["bundled"] }
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
regex = "1"
directories = "6"
hound = "3.5"
flacenc = "0.5"
deunicode = "1.6"
tempfile = "3"
# captura (fase 3): só no crate recorder; versões validadas no spike (RECORDING_SPIKE.md)
libpulse-binding = "2.30"
libpulse-simple-binding = "2.29"

[profile.release]
lto = "thin"
codegen-units = 1
strip = true

[profile.dev.package.flacenc]
opt-level = 3
