[package]
name = "rstt-core"
version.workspace = true
edition.workspace = true
license.workspace = true

[lib]
name = "core_lib"

[dependencies]
anyhow.workspace = true
thiserror.workspace = true
serde.workspace = true
serde_json.workspace = true
rusqlite.workspace = true
chrono.workspace = true
regex.workspace = true
directories.workspace = true
hound.workspace = true
flacenc.workspace = true
deunicode.workspace = true
ureq.workspace = true
sha2.workspace = true
bzip2.workspace = true
tar.workspace = true
flate2.workspace = true
libc.workspace = true
num_cpus.workspace = true
symphonia.workspace = true
# só tipos do sidecar e reparo de WAV: sem o backend libpulse (o shell Tauri liga o backend)
rstt-recorder = { path = "../recorder", default-features = false }

[dev-dependencies]
tempfile.workspace = true
claxon = "0.4"
md-5 = "0.10"
# só os exemplos (`player_probe`) tocam de verdade: ligam o backend libpulse que o núcleo não usa
rstt-recorder = { path = "../recorder", features = ["pulse"] }
