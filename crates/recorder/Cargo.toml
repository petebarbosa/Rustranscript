[package]
name = "tary-recorder"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Captura de áudio (mic + áudio do sistema) em WAV à prova de queda"

[lib]
name = "recorder"

[features]
# Backend libpulse (só Linux). O núcleo usa `default-features = false`: só precisa dos tipos e do reparo.
default = ["pulse"]
pulse = ["dep:libpulse-binding", "dep:libpulse-simple-binding"]

[dependencies]
serde.workspace = true
serde_json.workspace = true
chrono.workspace = true
thiserror.workspace = true

[target.'cfg(target_os = "linux")'.dependencies]
libpulse-binding = { workspace = true, optional = true }
libpulse-simple-binding = { workspace = true, optional = true }

[dev-dependencies]
tempfile.workspace = true
hound.workspace = true
