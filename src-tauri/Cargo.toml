[package]
name = "transcriptary"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Record and transcribe your meetings locally"

[[bin]]
name = "tary"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2.7", features = [] }

[dependencies]
tary-core = { path = "../crates/core" }
tary-recorder = { path = "../crates/recorder" }
tauri = { version = "2.12", features = ["tray-icon", "image-png"] }
tauri-plugin-global-shortcut = "2.4"
tauri-plugin-single-instance = "2.5"
tauri-plugin-dialog = "2.8"
serde.workspace = true
serde_json.workspace = true
anyhow.workspace = true
clap = { version = "4.6", features = ["derive"] }
sys-locale = "0.3"
tauri-plugin-opener = "2.7"

[dev-dependencies]
tempfile.workspace = true
